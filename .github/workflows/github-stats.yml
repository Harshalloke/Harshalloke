name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate GitHub Stats
        uses: anuraghazra/github-readme-stats@master
        with:
          github_user_name: Harshalloke

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: anuraghazra/github-readme-stats@master
        with:
          github_user_name: Harshalloke
          card: stats
          options: username=Harshalloke&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: anuraghazra/github-readme-stats@master
        with:
          github_user_name: Harshalloke
          card: top-langs
          options: username=Harshalloke&layout=compact&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit stats
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update GitHub stats" || exit 0
          git push
